name: Horopter record
description: Run a command and record it as a Horopter change, with its outcome.
author: Horopter
branding:
  icon: clock
  color: blue

inputs:
  run:
    description: The command to run and record, executed by bash -e.
    required: true
  subject:
    description: The thing the command changes, e.g. acme/prod. A repository is not one.
    required: true
  type:
    description: The change's type.
    required: false
    default: deployment
  name:
    description: >-
      Appended to the change's ref. Required in a matrix job, where every leg shares one job.
    required: false
    default: ""
  title:
    description: A human-readable title. Defaults to "<workflow> / <job>".
    required: false
    default: ""
  actor:
    description: Who or what made the change. Defaults to the actor that triggered the run.
    required: false
    default: ""
  attributes:
    description: >-
      Extra attributes, one key=value per line, after the automatic sha, git_ref, workflow and
      run_url.
    required: false
    default: ""
  url:
    description: Horopter's ingress URL. Defaults to HOROPTER_INGRESS_URL from the environment.
    required: false
    default: ""
  key:
    description: >-
      A producer key, e.g. secrets.HOROPTER_INGRESS_KEY. Defaults to HOROPTER_INGRESS_KEY from the
      environment.
    required: false
    default: ""
  strict:
    description: Fail rather than run the command unrecorded when Horopter cannot be reached.
    required: false
    default: "false"
  horo-version:
    description: >-
      The horo release to run, verified against its checksums.txt. Defaults to the version this
      release pins.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Record
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/src/record.sh"
      env:
        INPUT_RUN: ${{ inputs.run }}
        INPUT_SUBJECT: ${{ inputs.subject }}
        INPUT_TYPE: ${{ inputs.type }}
        INPUT_NAME: ${{ inputs.name }}
        INPUT_TITLE: ${{ inputs.title }}
        INPUT_ACTOR: ${{ inputs.actor }}
        INPUT_ATTRIBUTES: ${{ inputs.attributes }}
        INPUT_URL: ${{ inputs.url }}
        INPUT_KEY: ${{ inputs.key }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_HORO_VERSION: ${{ inputs.horo-version }}
        INPUT_MATRIX: ${{ toJSON(matrix) }}
